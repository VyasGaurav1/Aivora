# Offline-first build: the starter build omits the local reasoning model.
# For the full offline build, first fetch it with `git lfs pull`
# (the model is a Git LFS file, 428970080 bytes, SHA-256 verified at build
# time), then build with -PaivoraIncludeLocalReasoning=true.
# Do not set aivoraIncludeLocalReasoning=true here until the model is
# present locally, or the build-time verification will fail.
